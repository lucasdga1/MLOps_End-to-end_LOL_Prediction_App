version: '3'
services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    build: .
    depends_on:
      - postgres
      - mlflow
    env_file:
      - cred.env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/dags/data
      - ./models:/opt/airflow/dags/models
      - ./gcp-key.json:/opt/airflow/gcp-key.json:ro
      - ./requirements_d.txt:/requirements.txt
      - ./src:/opt/airflow/dags/src
      - mlflow_data:/mlflow

  airflow-webserver:
    build: .
    depends_on:
      - postgres
      - mlflow
    env_file:
      - cred.env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/dags/data
      - ./models:/opt/airflow/dags/models
      - ./gcp-key.json:/opt/airflow/gcp-key.json:ro
      - ./requirements_d.txt:/requirements.txt
      - ./src:/opt/airflow/dags/src
      - mlflow_data:/mlflow
    command: webserver

  airflow-scheduler:
    build: .
    depends_on:
      - postgres
      - mlflow
    env_file:
      - cred.env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/dags/data
      - ./models:/opt/airflow/dags/models
      - ./gcp-key.json:/opt/airflow/gcp-key.json:ro
      - ./requirements_d.txt:/requirements.txt
      - ./src:/opt/airflow/dags/src
      - mlflow_data:/mlflow
    command: scheduler

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: mlflow_server
    environment:
      - BACKEND_URI=sqlite:///mlflow.db
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      bash -c "mkdir -p /mlflow/artifacts && chmod -R 777 /mlflow && mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_URI=models:/xgb_lol_model/1
    volumes:
      - mlflow_data:/mlflow
      - ./src:/app
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  mlflow_data:
